<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Team Poll</title>
<style>
:root{--navy:#0e1522;--panel:#18213a;--gold:#d2a44e;--soft:rgba(210,164,78,.38);--ink:#f3ebdd;--dim:rgba(243,235,221,.7);--ok:#76a86d}
*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
.w{max-width:560px;margin:0 auto;padding:26px 16px 40px}
.k{color:var(--gold);letter-spacing:2.5px;font-size:11px;text-align:center}
h1{font-weight:normal;text-align:center;font-size:27px;margin:8px 0 6px}
.sub{text-align:center;color:var(--dim);font-size:15px;line-height:1.5;margin:0 0 20px}
.who{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.who button{background:var(--panel);border:2px solid var(--soft);color:var(--ink);border-radius:14px;padding:14px 4px;font-size:16px;font-family:inherit;cursor:pointer}
.who button.on{background:linear-gradient(180deg,#e0b65e,#c99a3f);color:var(--navy);border-color:var(--gold);font-weight:700}
.lbl{color:var(--gold);font-size:13px;letter-spacing:.2em;text-align:center;margin:0 0 8px}
.slot{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--soft);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;user-select:none}
.slot.mine{border-color:var(--ok);background:rgba(118,168,109,.16)}
.slot .box{width:28px;height:28px;border-radius:8px;border:2px solid var(--soft);flex:none;display:grid;place-items:center;font-size:18px}
.slot.mine .box{background:var(--ok);border-color:var(--ok);color:#fff}
.slot .t{flex:1}
.slot .d{font-size:17px;font-weight:700}
.slot .n{font-size:13px;color:var(--dim);margin-top:3px}
.slot .c{font-size:15px;color:var(--gold);font-weight:700;white-space:nowrap}
.slot.best{box-shadow:0 0 0 2px var(--gold),0 8px 24px -10px rgba(210,164,78,.8)}
.locked .slot{cursor:default;opacity:.55}
.days{display:grid;gap:8px}
.day h3{margin:0 0 8px;text-align:center;font-weight:normal;color:var(--gold);font-size:16px;line-height:1.25}
.day h3 b{display:block;color:var(--ink);font-size:21px}
.day .slot{flex-direction:column;gap:6px;padding:12px 6px;text-align:center}
.day .slot .d{font-size:18px}
.day .slot .n{font-size:12px;min-height:1.2em}
.day .slot .box{width:24px;height:24px;font-size:15px}
.save{display:block;width:100%;margin-top:14px;background:linear-gradient(180deg,#e0b65e,#c99a3f);color:var(--navy);border:0;border-radius:999px;padding:15px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
.save:disabled{opacity:.5}
.msg{text-align:center;color:var(--gold);min-height:1.4em;margin-top:10px}
@media(max-width:420px){.who{gap:6px}.who button{font-size:14px;padding:13px 2px}}
.note{color:var(--dim);font-size:13px;text-align:center;margin-top:18px;line-height:1.5}
</style></head><body><div class="w">
<div class="k" id="kick">EARTH HARMONY · TEAM</div>
<h1 id="ttl">Find a time</h1>
<p class="sub" id="sub">Tap your name, then every time that works for you.</p>
<div class="who" id="who"></div>
<div id="list"></div>
<button class="save" id="save" disabled>Save my answers</button>
<div class="msg" id="msg"></div>
<p class="note">The gold-outlined slot is where the most of us overlap. Marcus confirms once we have a match.</p>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbzzu1jXVtwDuHyBThe62Ipc10UzBJkDQDACGZfe5oEF9jXIUl3qtGjbJD2c3IW_q4EjKQ/exec';
const FORM='https://formsubmit.co/ajax/68bf44fd6c680760a90740f0fc752510';
/* Reusable team poll (Oct 28 2026). ?p=<id> → config in store key 'team-poll-config-<id>':
   {kicker, title, sub, people:[...], slots:[[id,'Mon Nov 16','3:00pm'],...]}  answers → 'team-poll-<id>' */
const PID=((new URLSearchParams(location.search).get('p')||'').match(/^[a-z0-9-]+/i)||[''])[0];
const KEY=PID==='enoch-practice'?'enoch-practice-poll':'team-poll-'+PID;
let PEOPLE=[], SLOTS=[];
let data={}, me=null, picks=new Set();
try{me=localStorage.getItem('eh-poll-me')}catch(e){}
const load=async()=>{try{const r=await fetch(API+'?key='+KEY);const j=r.ok?await r.json():{};return j&&typeof j==='object'?j:{}}catch(e){return {}}};
const save=v=>fetch(API,{method:'POST',body:JSON.stringify({key:KEY,value:v})});
function paint(){
  document.getElementById('who').innerHTML=PEOPLE.map(p=>`<button class="${p===me?'on':''}" data-p="${p}">${p}${data[p]?' ✓':''}</button>`).join('');
  document.querySelectorAll('#who button').forEach(b=>b.onclick=()=>{me=b.dataset.p;try{localStorage.setItem('eh-poll-me',me)}catch(e){}picks=new Set(data[me]||[]);paint()});
  const counts=Object.fromEntries(SLOTS.map(s=>[s[0],PEOPLE.filter(p=>(p===me?[...picks]:(data[p]||[])).includes(s[0]))]));
  const max=Math.max(0,...Object.values(counts).map(a=>a.length));
  const L=document.getElementById('list'); L.className=me?'':'locked';
  const days=[...new Set(SLOTS.map(x=>x[1]))];
  L.innerHTML=`<div class="days" style="grid-template-columns:repeat(${days.length},1fr)">`+days.map(day=>{const [wd,...rest]=day.split(' ');
    return `<div class="day"><h3>${wd}<b>${rest.join(' ')}</b></h3>`+SLOTS.filter(x=>x[1]===day).map(([id,,t])=>{const who=counts[id];
      return `<div class="slot ${picks.has(id)&&me?'mine':''} ${max>0&&who.length===max?'best':''}" data-id="${id}"><div class="box">${picks.has(id)&&me?'✓':''}</div><div class="d">${t}</div><div class="c">${who.length}/${PEOPLE.length}</div><div class="n">${who.join(', ')}</div></div>`}).join('')+'</div>'}).join('')+'</div>';
  L.querySelectorAll('.slot').forEach(s=>s.onclick=()=>{if(!me)return;const id=s.dataset.id;picks.has(id)?picks.delete(id):picks.add(id);paint()});
  document.getElementById('save').disabled=!me;
  document.getElementById('save').textContent=me?`Save ${me}'s answers`:'Tap your name first';
}
document.getElementById('save').onclick=async()=>{
  const b=document.getElementById('save');b.disabled=true;b.textContent='Saving…';
  data=await load(); data[me]=[...picks]; await save(data);
  const txt=SLOTS.filter(s=>picks.has(s[0])).map(s=>s[1]+' '+s[2]).join(', ')||'none of these';
  try{await fetch(FORM,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({_subject:`🗓 Team poll (${document.title}): ${me} answered`,_template:'table',_captcha:'false',name:me,can_do:txt})})}catch(e){}
  document.getElementById('msg').textContent='🙏 Saved, thank you!';paint();
};
(async()=>{
  let cfg={};try{const r=await fetch(API+'?key=team-poll-config-'+PID);cfg=r.ok?await r.json():{}}catch(e){}
  if(!PID||!cfg||!cfg.slots){document.getElementById('ttl').textContent='Poll not found';document.getElementById('save').style.display='none';return;}
  PEOPLE=cfg.people||[];SLOTS=cfg.slots;
  if(cfg.kicker)document.getElementById('kick').textContent=cfg.kicker;
  if(cfg.title){document.getElementById('ttl').textContent=cfg.title;document.title=cfg.title;}
  if(cfg.sub)document.getElementById('sub').innerHTML=cfg.sub;
  if(!PEOPLE.includes(me))me=null;
  data=await load();if(me)picks=new Set(data[me]||[]);paint();
})();
</script></body></html>
