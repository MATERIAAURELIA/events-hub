<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Sacred Geometry VR — Platonic Solids</title>
<style>
  :root{--bg:#070a0f;--ink:#e8e2d4;--amber:#d4af37;--teal:#5fb3a3;--dim:#4a5468}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  #intro{position:fixed;top:24px;left:0;right:0;display:flex;flex-direction:column;
    align-items:center;gap:12px;text-align:center;padding:0 24px;z-index:5;
    pointer-events:none}
  h1{font-weight:300;letter-spacing:.22em;color:var(--amber);font-size:20px;margin:0}
  p{color:var(--dim);font-size:13px;line-height:1.8;max-width:400px;margin:0;letter-spacing:.04em}
  .keys{color:var(--teal);font-size:12px;line-height:2}
</style>
</head>
<body>
<div id="intro">
  <h1>S A C R E D &nbsp; G E O M E T R Y &nbsp; V R</h1>
  <p>The five platonic solids, to build and to hold.</p>
  <div class="keys">
    point at the shelf &nbsp;·&nbsp; <b>trigger</b> builds that solid<br>
    <b>grip</b> near a solid &nbsp;·&nbsp; carry it, turn it<br>
    let go while turning &nbsp;·&nbsp; it keeps spinning<br>
    <b>trigger</b> on a solid &nbsp;·&nbsp; start or stop its spin<br>
    <b>B / Y</b> &nbsp;·&nbsp; clear everything
  </div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

// ─────────────── scene ───────────────
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x070a0f);
scene.fog=new THREE.FogExp2(0x070a0f,0.045);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.05,120);
camera.position.set(0,1.6,0.9);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled=true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

scene.add(new THREE.HemisphereLight(0x7a97b8,0x0a0e14,0.75));
const key=new THREE.DirectionalLight(0xffe9c0,0.8); key.position.set(2,4,2); scene.add(key);
const rim=new THREE.DirectionalLight(0x5fb3a3,0.45); rim.position.set(-3,1,-2); scene.add(rim);
scene.add(new THREE.GridHelper(16,32,0x1d2838,0x111924));

// ─────────────── the five ───────────────
const SOLIDS=[
  {name:'Tetrahedron',  geo:r=>new THREE.TetrahedronGeometry(r)},
  {name:'Hexahedron',   geo:r=>new THREE.BoxGeometry(r*1.15,r*1.15,r*1.15)},
  {name:'Octahedron',   geo:r=>new THREE.OctahedronGeometry(r)},
  {name:'Dodecahedron', geo:r=>new THREE.DodecahedronGeometry(r)},
  {name:'Icosahedron',  geo:r=>new THREE.IcosahedronGeometry(r)},
];

function makeLabel(text,h=0.05){
  const cv=document.createElement('canvas'); cv.width=512; cv.height=128;
  const g=cv.getContext('2d');
  g.font='500 52px -apple-system,Segoe UI,sans-serif';
  g.textAlign='center'; g.textBaseline='middle';
  g.fillStyle='rgba(232,226,212,0.9)'; g.fillText(text,256,64);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({
    map:new THREE.CanvasTexture(cv),transparent:true,depthWrite:false,opacity:0.8}));
  sp.scale.set(h*4,h,1);
  return sp;
}

// a solid: translucent body, glowing edges, bright vertices
function buildSolid(def,r){
  const g=new THREE.Group();
  const geo=def.geo(r);
  const body=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({
    color:0x5fb3a3,transparent:true,opacity:0.14,roughness:0.35,metalness:0.1,
    side:THREE.DoubleSide,depthWrite:false}));
  const edges=new THREE.LineSegments(new THREE.EdgesGeometry(geo,1),
    new THREE.LineBasicMaterial({color:0xd4af37,transparent:true,opacity:0.95}));
  const verts=new THREE.Points(geo,new THREE.PointsMaterial({
    color:0xfff0c8,size:r*0.1,sizeAttenuation:true}));
  g.add(body,edges,verts);
  g.userData={def,r,body,edges,spin:new THREE.Vector3(0,0.3,0),held:false};
  return g;
}

const built=[];
function place(def,pos){
  const s=buildSolid(def,0.17);
  s.position.copy(pos);
  const lb=makeLabel(def.name,0.05); lb.position.set(0,0.28,0); s.add(lb);
  scene.add(s); built.push(s);
  return s;
}
function clearAll(){
  while(built.length){
    const s=built.pop(); scene.remove(s);
    s.traverse(o=>{o.geometry?.dispose?.(); o.material?.dispose?.();});
  }
}

// ─────────────── the shelf ───────────────
const shelf=new THREE.Group();
shelf.position.set(0,1.05,-1.2);
scene.add(shelf);
const shelfItems=[];
SOLIDS.forEach((def,i)=>{
  const s=buildSolid(def,0.062);
  s.position.set((i-2)*0.30,0,0);
  s.userData.def=def;
  const lb=makeLabel(def.name,0.03); lb.position.set(0,0.13,0);
  s.add(lb);
  shelf.add(s); shelfItems.push(s);
});
const hint=makeLabel('point  ·  trigger  ·  it appears in front of you',0.035);
hint.position.set(0,-0.18,0); shelf.add(hint);

// ─────────────── controllers ───────────────
const factory=new XRControllerModelFactory();
const hands=[];
for(let i=0;i<2;i++){
  const c=renderer.xr.getController(i);
  const grip=renderer.xr.getControllerGrip(i);
  grip.add(factory.createControllerModel(grip));
  scene.add(c,grip);
  c.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(0,0,-1.8)]),
    new THREE.LineBasicMaterial({color:0x5fb3a3,transparent:true,opacity:0.4})));
  c.add(new THREE.Mesh(new THREE.SphereGeometry(0.011,10,10),
    new THREE.MeshBasicMaterial({color:0xfff0c8})));
  const h={c,idx:i,carry:null,prevQ:new THREE.Quaternion(),omega:new THREE.Vector3()};
  hands.push(h);
  c.addEventListener('selectstart',()=>onTrigger(h));
  c.addEventListener('squeezestart',()=>onGrip(h));
  c.addEventListener('squeezeend',()=>onRelease(h));
}
function pulse(h,s,ms){
  renderer.xr.getSession()?.inputSources?.[h.idx]?.gamepad?.hapticActuators?.[0]?.pulse?.(s,ms);
}

const ray=new THREE.Raycaster(), tmpM=new THREE.Matrix4(), _wp=new THREE.Vector3();
function aimed(h,objs){
  tmpM.identity().extractRotation(h.c.matrixWorld);
  ray.ray.origin.setFromMatrixPosition(h.c.matrixWorld);
  ray.ray.direction.set(0,0,-1).applyMatrix4(tmpM);
  return ray.intersectObjects(objs,true)[0];
}
function ownerOf(obj,list){let o=obj;while(o){if(list.includes(o))return o;o=o.parent;}return null;}
function nearHand(h,maxD=0.3){
  h.c.getWorldPosition(_wp);
  let best=null,bd=maxD;
  for(const s of built){
    const d=s.getWorldPosition(new THREE.Vector3()).distanceTo(_wp);
    if(d<bd){bd=d;best=s;}
  }
  return best;
}

function onTrigger(h){
  const hit=aimed(h,shelfItems);
  if(hit){
    const s=ownerOf(hit.object,shelfItems);
    if(s){
      h.c.getWorldPosition(_wp);
      const dir=new THREE.Vector3(0,0,-0.7)
        .applyQuaternion(h.c.getWorldQuaternion(new THREE.Quaternion()));
      place(s.userData.def,_wp.clone().add(dir));
      pulse(h,0.6,60);
      return;
    }
  }
  const target=nearHand(h,0.35)||(()=>{const g=aimed(h,built);
    return g?ownerOf(g.object,built):null;})();
  if(target){
    const sp=target.userData.spin;
    if(sp.lengthSq()>1e-6)sp.set(0,0,0); else sp.set(0,0.4,0);
    pulse(h,0.4,40);
  }
}
function onGrip(h){
  const s=nearHand(h);
  if(!s)return;
  s.userData.held=true;
  s.userData.spin.set(0,0,0);
  s.userData.edges.material.opacity=1;
  h.carry={s,
    offset:s.position.clone().sub(h.c.getWorldPosition(new THREE.Vector3())),
    q0:s.quaternion.clone(),
    cq0:h.c.getWorldQuaternion(new THREE.Quaternion()).clone()};
  pulse(h,0.5,40);
}
function onRelease(h){
  if(!h.carry)return;
  const s=h.carry.s;
  s.userData.held=false;
  s.userData.edges.material.opacity=0.95;
  s.userData.spin.copy(h.omega).multiplyScalar(0.9);   // the flick becomes the spin
  h.carry=null;
  pulse(h,0.3,30);
}

let prevB={};
function readButtons(){
  const sess=renderer.xr.getSession(); if(!sess)return;
  sess.inputSources.forEach((src,i)=>{
    const b=src.gamepad?.buttons[5]?.pressed;
    if(b&&!prevB[i])clearAll();
    prevB[i]=b;
  });
}

// ─────────────── loop ───────────────
const clock=new THREE.Clock();
const _q=new THREE.Quaternion(), _e=new THREE.Euler();
renderer.setAnimationLoop(()=>{
  const dt=Math.min(0.05,clock.getDelta());
  readButtons();

  for(const h of hands){
    const q=h.c.getWorldQuaternion(new THREE.Quaternion());
    _q.copy(h.prevQ).invert().premultiply(q);
    _e.setFromQuaternion(_q);
    h.omega.set(_e.x,_e.y,_e.z).multiplyScalar(0.08/Math.max(dt,0.001));
    h.prevQ.copy(q);
    if(h.carry){
      const s=h.carry.s;
      s.position.copy(h.c.getWorldPosition(new THREE.Vector3()).add(h.carry.offset));
      s.quaternion.copy(q).multiply(h.carry.cq0.clone().invert()).multiply(h.carry.q0);
    }
  }

  for(const s of built){
    if(!s.userData.held){
      const sp=s.userData.spin;
      s.rotateX(sp.x*dt); s.rotateY(sp.y*dt); s.rotateZ(sp.z*dt);
    }
    let near=false;
    for(const h of hands){
      h.c.getWorldPosition(_wp);
      if(s.getWorldPosition(new THREE.Vector3()).distanceTo(_wp)<0.3)near=true;
    }
    const b=s.userData.body.material;
    b.opacity += ((near?0.32:0.14)-b.opacity)*0.12;
  }
  shelfItems.forEach(s=>{s.rotation.y+=dt*0.35; s.rotation.x+=dt*0.12;});

  renderer.render(scene,camera);
});

// desktop preview
let t0=performance.now();
(function idle(){
  if(!renderer.xr.isPresenting){
    const t=(performance.now()-t0)/1000;
    camera.position.x=Math.sin(t*0.12)*0.55;
    camera.lookAt(0,1.08,-1.2);
  }
  requestAnimationFrame(idle);
})();
</script>
</body>
</html>
