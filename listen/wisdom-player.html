<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Wisdom Dreams</title>
<style>body{margin:0;background:#0e1522;color:#f8f4ec;font-family:Georgia,serif;text-align:center;padding:48px 20px}h1{font-weight:normal;font-size:30px;margin:0 0 4px}p{color:#d2a44e;margin:0 0 28px;font-family:Arial,sans-serif;letter-spacing:2px;font-size:13px}audio{width:100%;max-width:420px}.t{max-width:420px;margin:0 auto 26px;border:1px solid #3a3122;border-radius:14px;padding:16px}h2{font-weight:normal;font-size:18px;margin:0 0 10px;color:#f7dc94}small{display:block;margin-top:18px;color:#c6c2b2;font-family:Arial,sans-serif}</style></head>
<body><h1>Wisdom Dreams</h1><p>MARCUS FUNG · EARTH HARMONY</p>
<div class="t"><h2>Full length · 70 min</h2><audio controls loop preload="metadata" src="wisdom-dreams-60.mp3"></audio></div>
<div class="t"><h2>Short edit · 11 min</h2><audio controls loop preload="metadata" src="wisdom-dreams.mp3"></audio></div>
<small id="wl">Both loop until you stop them · screen stays awake while playing</small>
<small>Or download to play offline: <a style="color:#d2a44e" href="wisdom-dreams-60.mp3" download>70 min</a> · <a style="color:#d2a44e" href="wisdom-dreams.mp3" download>11 min</a></small>
<script>
const a=[...document.querySelectorAll('audio')];let lock=null;
const wake=async()=>{try{if('wakeLock' in navigator&&!lock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>{lock=null})}}catch(e){}};
const playing=()=>a.some(x=>!x.paused);
a.forEach(x=>{
 x.addEventListener('play',()=>{a.forEach(y=>y!==x&&y.pause());wake();
  if('mediaSession' in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:'Wisdom Dreams',artist:'Marcus Fung',album:'Earth Harmony'});
   navigator.mediaSession.setActionHandler('play',()=>x.play());navigator.mediaSession.setActionHandler('pause',()=>x.pause())}});
 x.addEventListener('pause',()=>{if(!playing()&&lock){lock.release();lock=null}});
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&playing())wake()});
</script></body></html>
